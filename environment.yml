# Conda environment for the misinformation detection pipeline
#   conda env create -f environment.yml
#   conda activate misinfo
name: misinfo
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pandas>=2.0
  - numpy>=1.24
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - seaborn>=0.13
  - joblib
  - lightgbm>=4.0
  - xgboost>=2.0
  - jupyterlab
  - nbconvert
  - ipykernel
  - pip
  - pip:
      # Stage 5 DistilBERT (CPU build by default; see README for GPU)
      - torch>=2.1
      - transformers>=4.40
      - datasets>=2.18
      - accelerate>=0.30
      # Stage 7 explanations
      - lime
